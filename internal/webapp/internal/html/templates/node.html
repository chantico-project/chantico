<h2>{{ .Name }}</h2>
<form class="panel-form">
  <p class="panel-status">
    <span>Status</span>
    <strong>{{ .Status }}</strong>
  </p>
  <div class="manifest-header">
    <span>Manifest</span>
    <button type="button"
            class="edit-toggle"
            aria-pressed="false"
            onclick="toggleManifestEdit(this)">Edit</button>
  </div>
  <textarea name="manifest" rows="20" readonly>{{ .Manifest }}</textarea>
  <div class="panel-actions">
    <button type="button"
            class="manifest-update"
            hidden
            hx-put="/api/nodes/{{ .ID }}"
            hx-include="closest form"
            hx-target="#panel-content"
            hx-swap="innerHTML">Update</button>
    <button type="button"
            class="danger manifest-delete"
            hidden
            hx-delete="/api/nodes/{{ .ID }}"
            hx-confirm="Delete {{ .Name }}?"
            hx-target="#panel-content"
            hx-swap="innerHTML">Delete</button>
  </div>
</form>
<script>
function toggleManifestEdit(button) {
  const form = button.closest("form");
  const textarea = form.querySelector("textarea[name='manifest']");
  const editing = textarea.hasAttribute("readonly");
  if (editing) {
    textarea.removeAttribute("readonly");
  } else {
    textarea.setAttribute("readonly", "");
  }
  button.setAttribute("aria-pressed", String(editing));
  button.textContent = editing ? "View" : "Edit";
  form.querySelector(".manifest-update").hidden = !editing;
  form.querySelector(".manifest-delete").hidden = !editing;
}
</script>

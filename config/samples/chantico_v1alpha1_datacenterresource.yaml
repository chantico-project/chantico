apiVersion: v1
kind: ConfigMap
metadata:
  name: pdu-energymetric-template
data:
  template: |
    tnoPduPowerValue{job="{{ .jobName }}", name="{{ .resourceName }}"}
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu1
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu1-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: jobName
      value: tno
    - name: resourceName
      value: physicalmeasurement-pdu1-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu2
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu2-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: jobName
      value: tno-2
    - name: resourceName
      value: physicalmeasurement-pdu2-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01
spec:
  type: baremetal
  parents:
    - name: datacenterresource-pdu1
      coefficient: "1"
    - name: datacenterresource-pdu2
      coefficient: "1"
  additionalLabels:
    exampleLabel: exampleValue
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: mock-prometheus-attribution-template
data:
  template: |
    vm_attribution_coefficient{name="{{ .resource }}", resource_consumer_id="{{ .cgroup }}"}

---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-vm-120
spec:
  type: vm
  parents:
    - name: datacenterresource-pdu1
      coefficientFrom:
        configMapKeyRef:
          name: mock-prometheus-attribution-template
          key: template
        parameters:
        - name: resource
          value: "physicalmeasurement-bm1"
        - name: cgroup
          value: "/qemu.slice/120.scope" 
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-vm-121
spec:
  type: vm
  parents:
    - name: datacenterresource-pdu1
      coefficientFrom:
        configMapKeyRef:
          name: mock-prometheus-attribution-template
          key: template
        parameters:
        - name: resource
          value: "physicalmeasurement-bm1"
        - name: cgroup
          value: "/qemu.slice/121.scope" 
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdu-energymetric-template
data:
  template: |
    tnoPduPowerValue{job="{{ .jobName }}", name="{{ .resourceName }}"}
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu1
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu1-out
  energyMetricFrom:
    valueFrom:
      configMapKeyRef:
        name: pdu-energymetric-template
        key: template
    parameters:
    - name: jobName
      value: tno
    - name: resourceName
      value: physicalmeasurement-pdu1-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu2
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu2-out
  energyMetricFrom:
    valueFrom:
      configMapKeyRef:
        name: pdu-energymetric-template
        key: template
    parameters:
    - name: jobName
      value: tno-2
    - name: resourceName
      value: physicalmeasurement-pdu2-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01
spec:
  type: baremetal
  serviceId: 1ec4f74e-35bc-4e7e-aef2-9db3c94e55be
  parents:
    - name: datacenterresource-pdu1
      coefficientFrom: 
        value: "1"
    - name: datacenterresource-pdu2
      coefficientFrom:
        value: "1"
  additionalLabels:
    exampleLabel: exampleValue

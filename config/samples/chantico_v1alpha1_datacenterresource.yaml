apiVersion: v1
kind: ConfigMap
metadata:
  name: pdu-energymetric-template
data:
  template: |
    tnoPduPowerValue{job="{{ .jobName }}"}
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu1
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu1-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: jobName
      value: tno
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu2
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu2-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: jobName
      value: tno-2
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01
spec:
  type: baremetal
  serviceId: 1ec4f74e-35bc-4e7e-aef2-9db3c94e55be
  parents:
    - name: datacenterresource-pdu1
      coefficient: "1"
    - name: datacenterresource-pdu2
      coefficient: "1"

apiVersion: v1
kind: ConfigMap
metadata:
  name: pdu-energymetric-template
data:
  template: |
    tnoPduPowerValue{name="{{ .resourceName }}"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-attribution-coefficient-template
data:
  template: |
    sum(vm_attribution_coefficient{resource_consumer_id="/qemu.slice/{{ .vmid }}.scope"})
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu1
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu1-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: resourceName
      value: physicalmeasurement-pdu1-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-pdu2
spec:
  type: pdu
  physicalMeasurements:
    - physicalMeasurement-pdu2-out
  energyMetricFrom:
    configMapKeyRef:
      name: pdu-energymetric-template
      key: template
    parameters:
    - name: resourceName
      value: physicalmeasurement-pdu2-out
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01
spec:
  type: baremetal
  parents:
    - name: datacenterresource-pdu1
      coefficient: "1"
    - name: datacenterresource-pdu2
      coefficient: "1"
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01-vm-120
spec:
  type: vm
  serviceId: 1ec4f74e-35bc-4e7e-aef2-9db3c94e55ba
  parents:
    - name: datacenterresource-misd-gbm-01
      coefficientFrom:
        configMapKeyRef:
          name: vm-attribution-coefficient-template
          key: template
        parameters:
        - name: vmid
          value: "120"
---
apiVersion: chantico-project.github.io/v1alpha1
kind: DataCenterResource
metadata:
  labels:
    app.kubernetes.io/name: chantico
    app.kubernetes.io/managed-by: kustomize
  name: datacenterresource-misd-gbm-01-vm-121
spec:
  type: vm
  serviceId: 1ec4f74e-35bc-4e7e-aef2-9db3c94e55be
  parents:
    - name: datacenterresource-misd-gbm-01
      coefficientFrom:
        configMapKeyRef:
          name: vm-attribution-coefficient-template
          key: template
        parameters:
        - name: vmid
          value: "121"
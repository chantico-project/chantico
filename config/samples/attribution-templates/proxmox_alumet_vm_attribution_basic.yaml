apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox9-alumet-energy-attribution-coefficient-template
data:
  template: |
    label_replace(
      cpu_percent_alumet_ratio{
        name="{{ .resourceName }}",
        resource_consumer_kind="cgroup",
        kind="total",
        resource_consumer_id=~"/qemu.slice/{{ .vmid }}.scope(/.*)?"
      } / 100,
      "vmid",
      "{{ .vmid }}",
      "__name__",
      ".*"
    )
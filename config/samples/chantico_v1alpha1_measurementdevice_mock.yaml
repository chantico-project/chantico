apiVersion: v1
kind: Secret
metadata:
  name: tno-snmp-auth
stringData:
  auth: |
    community: public
    version: 2
---
apiVersion: chantico-project.github.io/v1alpha1
kind: MeasurementDevice
metadata:
  name: tno
  labels:
    app.kubernetes.io/name: chantico
spec:
  authFrom:
    valueFrom:
      secretKeyRef:
        name: tno-snmp-auth
        key: auth
  walks:
    - tnoPduEnergyValue
    - tnoPduPowerValue

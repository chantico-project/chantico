apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-snmp-mock
  labels:
    app: chantico-snmp-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-snmp-mock
  template:
    metadata:
      labels:
        app: chantico-snmp-mock
    spec:
      containers:
      - name: chantico-snmp-mock
        image: chantico-snmp-mock:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 1161
          protocol: UDP
        env:
        - name: MOCK_SNMP_ADDRESS
          value: ":1161"
        - name: MOCK_SNMP_VALUE_MIN
          value: "200"
        - name: MOCK_SNMP_VALUE_MAX
          value: "800"
        - name: MOCK_SNMP_VALUE_START
          value: "500"
        - name: MOCK_SNMP_VALUE_VARIANCE
          value: "10"

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: chantico-dev
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: chantico-dev
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chantico-dev
spec:
  gatewayClassName: chantico-dev
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: chantico-dev
  listeners:
    - name: http
      protocol: HTTP
      port: 80

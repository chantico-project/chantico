# Values for the local kind development cluster, used by `make cluster-configure`.
controller:
  enabled: false # run locally with `make run`
persistence:
  storageClass: local-development
  volumeName: chantico-persistent-volume # static hostPath PV from dev/k8s/persistent-volume.yaml
  size: 3Gi
prometheus:
  persistence:
    storageClass: "" # kind default (local-path)
  service:
    type: NodePort
victoriaMetrics:
  persistence:
    storageClass: ""
  service:
    type: NodePort
snmp:
  service:
    type: NodePort
filebrowser:
  service:
    type: NodePort
grafana:
  service:
    type: NodePort
visualisationWebapp:
  enabled: true
  service:
    type: NodePort

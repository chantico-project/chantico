languages:
  - name: Docker
  - name: Go
  - name: Html
exclude:
  - ".*/api/v1alpha1/zz_generated[.]deepcopy[.]go"
dependencychecker:
  blocklist:
    - .*tno.*
  transitive: true
thirdpartyfindings:
  enabled: true
  exclude:
    - ".*/.*_test[.].go"
    - ".*/.*mock.*.yaml"
    - ".*/testdata/.*[.]json"
    # Exclude the docker-compose files used for stress testing observability because it is a development setup restricted to the development team and not relevant for production deployments.
    - "./dev/stresstest-observability/docker-compose.yml"

languages:
  - name: Docker
  - name: Go
  - name: Html
exclude:
  - ".*/api/v1alpha1/zz_generated[.]deepcopy[.]go"
dependencychecker:
  blocklist:
    - .*tno.*
  transitive: true
  exclude:
   - vulnerability: "cve-2026-84303"
   - vulnerability: "cve-2026-84304"
   - vulnerability: "cve-2026-84445"
thirdpartyfindings:
  enabled: true
  exclude:
    - ".*/.*_test[.].go"
    - ".*/.*mock.*.yaml"
    - ".*/testdata/.*[.]json"

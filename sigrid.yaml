languages:
  - name: Docker
  - name: Go
  - name: Html
exclude:
  - ".*/api/v1alpha1/zz_generated[.]deepcopy[.]go"
dependencychecker:
  blocklist:
    - .*tno.*
  transitive: true
thirdpartyfindings:
  enabled: true
  exclude:
    - ".*/.*_test[.].go"
    - ".*/.*mock.*.yaml"
    - ".*/testdata/.*[.]json"

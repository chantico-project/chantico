{{- if and .Values.webapp.enabled .Values.webapp.httpRoute.enabled }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
{{- fail "webapp.httpRoute.enabled requires the Gateway API CRDs (gateway.networking.k8s.io/v1)" }}
{{- end }}
{{- if not .Values.webapp.httpRoute.parentRefs }}
{{- fail "webapp.httpRoute.parentRefs must reference at least one Gateway" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
  {{- with .Values.webapp.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.webapp.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.webapp.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: chantico-visualisation-webapp
          port: 80
{{- end }}

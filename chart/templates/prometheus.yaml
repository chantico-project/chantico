---
apiVersion: v1
kind: Service
metadata:
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: chantico-prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- if .Values.prometheus.useOperator }}
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: prometheus
    {{- else }}
    app: chantico-prometheus
    {{- end }}
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      {{- if eq .Values.prometheus.service.type "NodePort" }}
      nodePort: 30001
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs: ["get", "list", "watch"]
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: {{ .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccountName: prometheus
  retention: {{ .Values.prometheusRetention }}
  scrapeInterval: 10s
  scrapeTimeout: 5s
  evaluationInterval: 5s
  ruleSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  scrapeConfigSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  scrapeConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  {{- if .Values.victoriaMetrics.include }}
  remoteWrite:
    - url: http://chantico-victoriametrics:8428/api/v1/write
  {{- end }}
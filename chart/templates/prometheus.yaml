apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |-
    global:
      scrape_interval: 10s
      scrape_timeout: 5s
      evaluation_interval: 5s
    rule_files:
      - /tmp/prometheus-config/static_rules.yml
      - /tmp/prometheus-volume/rules/*.yml
    {{- if .Values.victoriaMetrics.include }}
    remote_write:
      - url: http://chantico-victoriametrics:8428/api/v1/write
    {{- end }}
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: snmp
        file_sd_configs:
          - files:
              - /tmp/prometheus-volume/targets/*.json
            refresh_interval: 30s
        metrics_path: /snmp
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: {{ .Values.snmpExporterAddress }}
  static_rules.yml: |-
    groups:
    - name: const-coefficients
      rules:
      - record: chantico_energy_coefficient
        expr: |
          label_replace(
            1 - sum by (parent) (
              chantico_energy_coefficient{kind="attribution"}
            ),
            "resource", "$1", "parent", "(.*)"
          )
        labels:
          kind: overhead
      - record: chantico_energy_watts
        expr:
          chantico_energy_watts{kind="total"}
          * on(resource) group_left()
          label_replace(
            chantico_energy_coefficient{kind="overhead"},
            "resource", "$1",
            "parent", "(.*)"
          )
        labels:
          kind: overhead
      - record: chantico_energy_watts
        expr: |
          chantico_energy_watts{kind="total"}
          * on(resource) group_left()
          label_replace(
            1 - chantico_energy_coefficient{kind="overhead"},
            "resource", "$1",
            "parent", "(.*)"
          )
        labels:
          kind: attributed

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-prometheus
  template:
    metadata:
      labels:
        app: chantico-prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: docker.io/prom/prometheus:v3.7.3
        name: prometheus
        command: ["prometheus"]
        args: ["--config.file=/tmp/prometheus-config/prometheus.yml", "--storage.tsdb.path=/tmp/prometheus-volume/storage", "--storage.tsdb.retention.time={{ .Values.prometheusRetention }}", "--web.enable-lifecycle", "--storage.tsdb.no-lockfile"]
        volumeMounts:
        - mountPath: "/tmp/prometheus-volume"
          name: chantico-volume-mount
          subPath: "prometheus"
        - mountPath: "/tmp/prometheus-config"
          name: chantico-prometheus-config
          readOnly: true
        ports:
        - containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      initContainers:
      - image: docker.io/library/busybox:1.36.1-glibc
        name: prometheus-initialization
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/sh"]
        args:
          - -c
          - |
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/config;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/storage;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/targets;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/rules;
            chmod -R 1777 /tmp/chantico-volume-mount/prometheus
        volumeMounts:
        - mountPath: "/tmp/chantico-volume-mount"
          name: chantico-volume-mount
        - mountPath: "/tmp/prometheus-config"
          name: chantico-prometheus-config
      volumes:
      - name: chantico-volume-mount
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaimName }}
      - name: chantico-prometheus-config
        configMap:
          name: chantico-prometheus-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    app: chantico-prometheus
  ports:
    - protocol: TCP
      port: 9090
      {{- if eq .Values.prometheus.service.type "NodePort" }}
      nodePort: 30001
      {{- else }}
      targetPort: 9090    
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: chantico-prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- if .Values.prometheus.useOperator }}
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: prometheus
    {{- else }}
    app: chantico-prometheus
    {{- end }}
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      {{- if eq .Values.prometheus.service.type "NodePort" }}
      nodePort: 30001
      {{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccountName: prometheus
  retention: {{ .Values.prometheusRetention }}
  scrapeInterval: 10s
  scrapeTimeout: 5s
  evaluationInterval: 5s
  {{- $watchNamespace := .Values.controller.watchNamespace | default .Release.Namespace }}
  ruleSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  ruleNamespaceSelector:
    {{- if eq $watchNamespace "*" }}
    {}
    {{- else }}
    matchLabels:
      kubernetes.io/metadata.name: {{ $watchNamespace }}
    {{- end }}
  scrapeConfigSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  scrapeConfigNamespaceSelector:
    {{- if eq $watchNamespace "*" }}
    {}
    {{- else }}
    matchLabels:
      kubernetes.io/metadata.name: {{ $watchNamespace }}
    {{- end }}
  {{- if .Values.victoriaMetrics.include }}
  remoteWrite:
    - url: http://chantico-victoriametrics:8428/api/v1/write
  {{- end }}
{{- if not .Values.prometheus.useOperator }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |-
    global:
      scrape_interval: 10s
      scrape_timeout: 5s
      evaluation_interval: 5s
    rule_files:
      - /tmp/prometheus-volume/rules/*.yml
    {{- if .Values.victoriaMetrics.include }}
    remote_write:
      - url: http://chantico-victoriametrics:8428/api/v1/write
    {{- end }}
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: snmp
        file_sd_configs:
          - files:
              - /tmp/prometheus-volume/targets/snmp/*.json
            refresh_interval: 30s
        metrics_path: /snmp
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: {{ .Values.snmpExporterAddress }}
      - job_name: prometheus-exporter
        file_sd_configs:
          - files:
              - /tmp/prometheus-volume/targets/prometheus-exporter/*.json
            refresh_interval: 30s
        metrics_path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-prometheus
  template:
    metadata:
      labels:
        app: chantico-prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: docker.io/prom/prometheus:v3.7.3
        name: prometheus
        command: ["prometheus"]
        args: ["--config.file=/tmp/prometheus-config/prometheus.yml", "--storage.tsdb.path=/tmp/prometheus-volume/storage", "--storage.tsdb.retention.time={{ .Values.prometheusRetention }}", "--web.enable-lifecycle", "--storage.tsdb.no-lockfile"]
        volumeMounts:
        - mountPath: "/tmp/prometheus-volume"
          name: chantico-volume-mount
          subPath: "prometheus"
        - mountPath: "/tmp/prometheus-config"
          name: chantico-prometheus-config
          readOnly: true
        ports:
        - containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      initContainers:
      - image: docker.io/library/busybox:1.36.1-glibc
        name: prometheus-initialization
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/sh"]
        args:
          - -c
          - |
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/config;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/storage;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/targets;
            mkdir -m 777 -p /tmp/chantico-volume-mount/prometheus/rules;
            chmod -R 1777 /tmp/chantico-volume-mount/prometheus
        volumeMounts:
        - mountPath: "/tmp/chantico-volume-mount"
          name: chantico-volume-mount
      volumes:
      - name: chantico-volume-mount
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaimName }}
      - name: chantico-prometheus-config
        configMap:
          name: chantico-prometheus-config
      restartPolicy: Always
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: chantico-prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  selector:
    {{- if .Values.prometheus.useOperator }}
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: prometheus
    {{- else }}
    app: chantico-prometheus
    {{- end }}
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      {{- if eq .Values.prometheus.service.type "NodePort" }}
      nodePort: 30001
      {{- end }}
    {{- if .Values.prometheus.useOperator }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs: ["get", "list", "watch"]
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: {{ .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccountName: prometheus
  retention: {{ .Values.prometheusRetention }}
  scrapeInterval: 10s
  scrapeTimeout: 5s
  evaluationInterval: 5s
  ruleSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  ruleNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  scrapeConfigSelector:
    matchLabels:
      app.kubernetes.io/managed-by: chantico
  scrapeConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  {{- if .Values.victoriaMetrics.include }}
  remoteWrite:
    - url: http://chantico-victoriametrics:8428/api/v1/write
  {{- end }}
{{- end }}
{{- if and .Values.controller.enabled .Values.controller.image.repository }}
{{- $claim := .Values.persistence.existingClaim | default "chantico-persistent-volume-claim" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chantico-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
        chantico-project.github.io/data-volume: {{ $claim | quote }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      {{- if has "ReadWriteOnce" .Values.persistence.accessModes }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  chantico-project.github.io/data-volume: {{ $claim | quote }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          {{- with .Values.controller.image }}
          image: "{{ with .registry }}{{ . }}/{{ end }}{{ .repository }}{{ if .digest }}@{{ .digest }}{{ else }}:{{ .tag | default $.Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          {{- end }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            - name: CHANTICO_DATA_PATH
              value: "/data"
            - name: CHANTICO_PERSISTENT_VOLUME_CLAIM_NAME
              value: {{ $claim | quote }}
            - name: CHANTICO_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CHANTICO_WATCH_NAMESPACE
              value: {{ .Values.controller.watchNamespace | default .Release.Namespace | quote }}
            - name: CHANTICO_SNMP_EXPORTER_SERVICE_HOST
              value: "chantico-snmp.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CHANTICO_SNMP_EXPORTER_SERVICE_PORT
              value: "9116"
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: chantico-volume
              mountPath: /data
      volumes:
        - name: chantico-volume
          persistentVolumeClaim:
            claimName: {{ $claim | quote }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: chantico-controller-manager
      terminationGracePeriodSeconds: 10
{{- end }}

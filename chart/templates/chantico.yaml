{{- if and .Values.controller.enabled .Values.controller.image.repository }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chantico-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
        {{- include "chantico.dataVolumeLabel" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      {{- include "chantico.dataVolumeAffinity" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            - name: CHANTICO_DATA_PATH
              value: "/data"
            - name: CHANTICO_PERSISTENT_VOLUME_CLAIM_NAME
              value: {{ include "chantico.dataClaimName" . | quote }}
            - name: CHANTICO_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CHANTICO_WATCH_NAMESPACE
              value: {{ .Values.controller.watchNamespace | default .Release.Namespace | quote }}
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: chantico-volume
              mountPath: /data
      volumes:
        - name: chantico-volume
          persistentVolumeClaim:
            claimName: {{ include "chantico.dataClaimName" . | quote }}
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      serviceAccountName: chantico-controller-manager
      terminationGracePeriodSeconds: 10
{{- end }}

{{- if and .Values.controller.include .Values.controller.image }}
# Generated from controller-gen rbac markers — keep rules in sync with `make manifests` and manually add any additional rules as needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chantico.fullname" . }}-manager-role
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chantico-project.github.io
  resources:
  - datacenterresources
  - measurementdevices
  - physicalmeasurements
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chantico-project.github.io
  resources:
  - datacenterresources/finalizers
  verbs:
  - update
- apiGroups:
  - chantico-project.github.io
  resources:
  - datacenterresources/status
  - measurementdevices/status
  - physicalmeasurements/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - chantico-project.github.io
  resources:
  - measurementdevices/finalizers
  - physicalmeasurements/finalizers
  verbs:
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chantico.fullname" . }}-manager-rolebinding
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chantico.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "chantico.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
---
# Leader election — namespaced Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chantico.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chantico.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chantico.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "chantico.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
{{- end }}

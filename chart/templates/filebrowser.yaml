{{- $claim := .Values.persistence.existingClaim | default "chantico-persistent-volume-claim" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-filebrowser
  template:
    metadata:
      labels:
        app: chantico-filebrowser
        chantico-project.github.io/data-volume: {{ $claim | quote }}
    spec:
      {{- if has "ReadWriteOnce" .Values.persistence.accessModes }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  chantico-project.github.io/data-volume: {{ $claim | quote }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      initContainers:
      - name: structure-initialization
        image: docker.io/library/busybox:1.36.1-glibc
        command: ["/bin/sh", "-c", "mkdir -p /srv/snmp/mibs"]
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: chantico-volume-mount
          mountPath: /srv
      containers:
      - name: filebrowser
        image: docker.io/filebrowser/filebrowser:v2.32.2
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: chantico-volume-mount
          mountPath: /srv
        command:
        - sh
        - -c
        - |
          /filebrowser config init --database /srv/.filebrowser.db;
          /filebrowser users add admin admin --database /srv/.filebrowser.db;
          /filebrowser --database /srv/.filebrowser.db
      volumes:
      - name: chantico-volume-mount
        persistentVolumeClaim:
          claimName: {{ $claim }}
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.filebrowser.service.type }}
  selector:
    app: chantico-filebrowser
  ports:
    - protocol: TCP
      port: 80
      {{- if eq .Values.filebrowser.service.type "NodePort" }}
      nodePort: 30000
      {{- else }}
      targetPort: 80    
      {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-filebrowser
  template:
    metadata:
      labels:
        app: chantico-filebrowser
        chantico-project.github.io/data-volume: {{ .Values.persistentVolumeClaimName | quote }}
    spec:
      {{- if has "ReadWriteOnce" .Values.pvc.accessModes }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  chantico-project.github.io/data-volume: {{ .Values.persistentVolumeClaimName | quote }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: structure-initialization
        image: docker.io/library/busybox:1.36.1-glibc
        command: ["/bin/sh", "-c", "mkdir -p /srv/snmp/mibs"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: chantico-volume-mount
          mountPath: /srv
      containers:
      - name: filebrowser
        image: docker.io/filebrowser/filebrowser:v2.32.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 80
        volumeMounts:
        - name: chantico-volume-mount
          mountPath: /srv
        command:
        - sh
        - -c
        - |
          /filebrowser config init --database /srv/.filebrowser.db;
          /filebrowser users add admin admin --database /srv/.filebrowser.db;
          /filebrowser --database /srv/.filebrowser.db
      volumes:
      - name: chantico-volume-mount
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.filebrowser.service.type }}
  selector:
    app: chantico-filebrowser
  ports:
    - protocol: TCP
      port: 80
      {{- if eq .Values.filebrowser.service.type "NodePort" }}
      nodePort: 30000
      {{- else }}
      targetPort: 80    
      {{- end }}

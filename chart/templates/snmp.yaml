apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-snmp-config
  namespace: {{ .Release.Namespace }}
data:
  snmp.yml: |
    auths:
      default:
        community: public
        security_level: noAuthNoPriv
        username: guest
        auth_protocol: MD5
        priv_protocol: DES
        version: 3
    modules:
      init:
        walk: []
        metrics: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-snmp
  template:
    metadata:
      labels:
        app: chantico-snmp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: docker.io/ricardbejarano/snmp_exporter:0.26.0
        name: snmp
        args:
        - --config.file=/snmp/snmp.yml
        volumeMounts:
        - mountPath: /snmp
          name: snmp-config
          readOnly: true
        ports:
        - containerPort: 9116
      volumes:
      - name: snmp-config
        configMap:
          name: chantico-snmp-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.snmp.service.type }}
  selector:
    app: chantico-snmp
  ports:
    - protocol: TCP
      port: 9116
      {{- if eq .Values.snmp.service.type "NodePort" }}
      nodePort: 30002
      {{- else }}
      targetPort: 9116    
      {{- end }}

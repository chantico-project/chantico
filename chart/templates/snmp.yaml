apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-snmp
  template:
    metadata:
      labels:
        app: chantico-snmp
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - image: docker.io/ricardbejarano/snmp_exporter:0.26.0
        name: snmp
        args:
        - --config.file=/snmp/snmp.yml
        volumeMounts:
        - mountPath: /snmp
          name: snmp-config
          readOnly: true
        ports:
        - containerPort: 9116
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- merge (omit .Values.containerSecurityContext "enabled") (dict "readOnlyRootFilesystem" true) | toYaml | nindent 10 }}
        {{- end }}
      volumes:
      - name: snmp-config
        configMap:
          name: chantico-snmp-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.snmpExporter.service.type }}
  selector:
    app: chantico-snmp
  ports:
    - protocol: TCP
      port: 9116
      {{- if eq .Values.snmpExporter.service.type "NodePort" }}
      nodePort: 30002
      {{- else }}
      targetPort: 9116    
      {{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-snmp-config
  namespace: {{ .Release.Namespace }}
data:
  snmp.yml: |
    auths:
      default:
        community: public
        security_level: noAuthNoPriv
        username: guest
        auth_protocol: MD5
        priv_protocol: DES
        version: 3
    modules:
      init:
        walk: []
        metrics: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-snmp
  template:
    metadata:
      labels:
        app: chantico-snmp
        chantico-project.github.io/data-volume: {{ .Values.persistentVolumeClaimName | quote }}
    spec:
      {{- if has "ReadWriteOnce" .Values.pvc.accessModes }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  chantico-project.github.io/data-volume: {{ .Values.persistentVolumeClaimName | quote }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: docker.io/ricardbejarano/snmp_exporter:0.26.0
        name: snmp
        args:
        - --config.file=/snmp/snmp.yml
        volumeMounts:
        - mountPath: /snmp
          name: snmp-config
          readOnly: true
        ports:
        - containerPort: 9116
      initContainers:
      - image: docker.io/library/busybox:1.36.1-glibc
        name: structure-initialization
        command: ["/bin/sh"]
        args:
          - -c
          - |
            mkdir -p /tmp/chantico-volume-mount/snmp/mibs;
            chmod -R 0777 /tmp/chantico-volume-mount/snmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: "/tmp/chantico-volume-mount"
          name: chantico-volume-mount
      volumes:
      - name: chantico-volume-mount
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaimName }}
      - name: snmp-config
        configMap:
          name: chantico-snmp-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-snmp
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.snmp.service.type }}
  selector:
    app: chantico-snmp
  ports:
    - protocol: TCP
      port: 9116
      {{- if eq .Values.snmp.service.type "NodePort" }}
      nodePort: 30002
      {{- else }}
      targetPort: 9116    
      {{- end }}

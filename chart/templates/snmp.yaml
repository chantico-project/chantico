apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: snmp-exporter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "chantico.fullname" . }}-snmp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "chantico.fullname" . }}-snmp
  template:
    metadata:
      labels:
        app: {{ include "chantico.fullname" . }}-snmp
        {{- include "chantico.labels" . | nindent 8 }}
        app.kubernetes.io/component: snmp-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: docker.io/ricardbejarano/snmp_exporter:0.26.0
        name: snmp
        args:
        - --config.file=/snmp/snmp.yml
        volumeMounts:
        - mountPath: /snmp
          name: snmp-config
          readOnly: true
        ports:
        - containerPort: 9116
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: snmp-config
        configMap:
          name: chantico-snmp-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chantico.fullname" . }}-snmp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: snmp-exporter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.snmp.service.type }}
  selector:
    app: {{ include "chantico.fullname" . }}-snmp
  ports:
    - protocol: TCP
      port: 9116
      {{- if eq .Values.snmp.service.type "NodePort" }}
      nodePort: 30002
      {{- else }}
      targetPort: 9116    
      {{- end }}

{{- if .Values.grafana.include }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chantico.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Chantico-Prometheus
        uid: chantico-prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "chantico.fullname" . }}-prometheus:9090
        isDefault: true
      - name: Chantico-VictoriaMetrics
        uid: chantico-victoriametrics
        type: prometheus
        access: proxy
        url: http://{{ include "chantico.fullname" . }}-victoriametrics:8428
        isDefault: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chantico.fullname" . }}-grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: chantico
        orgId: 1
        folder: Chantico
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chantico.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "chantico.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "chantico.fullname" . }}-grafana
  template:
    metadata:
      labels:
        app: {{ include "chantico.fullname" . }}-grafana
        {{- include "chantico.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.grafana.anonymous | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: light
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: datasources
          configMap:
            name: {{ include "chantico.fullname" . }}-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: {{ include "chantico.fullname" . }}-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: {{ include "chantico.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chantico.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    app: {{ include "chantico.fullname" . }}-grafana
  ports:
    - protocol: TCP
      port: 3000
      {{- if eq .Values.grafana.service.type "NodePort" }}
      nodePort: 30004
      {{- else }}
      targetPort: 3000
      {{- end }}
{{- end }}

{{- $grafana := index .Values "kube-prometheus-stack" "grafana" }}
{{- if and .Values.prometheus.useOperator $grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{ $grafana.sidecar.datasources.label }}: {{ $grafana.sidecar.datasources.labelValue | quote }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Chantico-Prometheus
        uid: chantico-prometheus
        type: prometheus
        access: proxy
        url: http://chantico-prometheus:9090
        isDefault: true
      - name: Chantico-VictoriaMetrics
        uid: chantico-victoriametrics
        type: prometheus
        access: proxy
        url: http://chantico-victoriametrics:8428
        isDefault: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{ $grafana.sidecar.dashboards.label }}: {{ $grafana.sidecar.dashboards.labelValue | quote }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-grafana
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
{{ include "grafana.selectorLabels" (index .Subcharts "kube-prometheus-stack").Subcharts.grafana | indent 4 }}
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      {{- if eq .Values.grafana.service.type "NodePort" }}
      nodePort: 30004
      {{- end }}
{{- end }}

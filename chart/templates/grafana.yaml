{{- $grafana := index .Values "kube-prometheus-stack" "grafana" }}
{{- if and .Values.prometheus.useOperator $grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chantico.fullname" . }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    {{ $grafana.sidecar.datasources.label }}: {{ $grafana.sidecar.datasources.labelValue | quote }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Chantico-Prometheus
        uid: chantico-prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "chantico.fullname" . }}-prometheus:9090
        isDefault: true
      - name: Chantico-VictoriaMetrics
        uid: chantico-victoriametrics
        type: prometheus
        access: proxy
        url: http://{{ include "chantico.fullname" . }}-victoriametrics:8428
        isDefault: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chantico.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    {{ $grafana.sidecar.dashboards.label }}: {{ $grafana.sidecar.dashboards.labelValue | quote }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chantico.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chantico.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $grafana.service.type }}
  selector:
{{ include "grafana.selectorLabels" (index .Subcharts "kube-prometheus-stack").Subcharts.grafana | indent 4 }}
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      {{- if eq $grafana.service.type "NodePort" }}
      nodePort: 30004
      {{- end }}
{{- end }}

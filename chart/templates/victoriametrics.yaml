{{- if .Values.victoriaMetrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-victoriametrics-config
  namespace: {{ .Release.Namespace }}
data:
  # Series get an extra label resolution="1m" to tell them apart from the raw forwarded data.
  downsample.yml: |-
    groups:
      - name: energy_downsample_1m
        interval: 1m
        rules:
          - record: chantico_power_watts:avg1m
            expr: >
              label_replace(
                avg_over_time({__name__=~"chantico_power_watts"}[1m]),
                "resolution", "1m", "", ""
              )
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: chantico
  name: chantico-victoriametrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  serviceName: chantico-victoriametrics
  selector:
    matchLabels:
      app: chantico-victoriametrics
  template:
    metadata:
      labels:
        app: chantico-victoriametrics
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - image: victoriametrics/victoria-metrics:v1.115.0
        name: victoriametrics
        args:
          - -storageDataPath={{ .Values.victoriaMetrics.persistence.mountPath }}
          - -retentionPeriod={{ .Values.victoriaMetrics.retention }}
          - -httpListenAddr=:8428
        volumeMounts:
        - mountPath: {{ .Values.victoriaMetrics.persistence.mountPath | quote }}
          name: chantico-volume-mount
        ports:
        - containerPort: 8428
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
      # vmalert evaluates recording rules against VictoriaMetrics every minute
      # and writes the results back, producing the per-minute downsampled series.
      - image: victoriametrics/vmalert:v1.115.0
        name: vmalert
        args:
          - -rule=/tmp/victoria-metrics-config/*.yml
          - -evaluationInterval=1m
          - -datasource.url=http://localhost:8428
          - -remoteWrite.url=http://localhost:8428
          - -remoteRead.url=http://localhost:8428
          - -httpListenAddr=:8880
        volumeMounts:
        - mountPath: "/tmp/victoria-metrics-config"
          name: chantico-victoriametrics-config
          readOnly: true
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
      volumes:
      - name: chantico-victoriametrics-config
        configMap:
          name: chantico-victoriametrics-config
      restartPolicy: Always
  volumeClaimTemplates:
  - metadata:
      name: chantico-volume-mount
    spec:
      {{- with .Values.victoriaMetrics.persistence }}
      {{- if .volumeName }}
      volumeName: {{ .volumeName }}
      {{- end }}
      {{- if .storageClass }}
      storageClassName: {{ .storageClass }}
      {{- end }}
      accessModes:
        {{- toYaml .accessModes | nindent 8 }}
      resources:
        requests:
          storage: {{ .size }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-victoriametrics
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.victoriaMetrics.service.type }}
  selector:
    app: chantico-victoriametrics
  ports:
    - protocol: TCP
      port: 8428
      {{- if eq .Values.victoriaMetrics.service.type "NodePort" }}
      nodePort: 30003
      {{- else }}
      targetPort: 8428
      {{- end }}
{{- end }}

{{- if .Values.victoriaMetrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: chantico-victoriametrics-rules
  namespace: {{ .Release.Namespace }}
data:
  # Downsample energy metrics to 1-minute averages, labelled resolution="1m".
  downsample.yml: |
    groups:
      - name: energy_downsample_1m
        interval: 1m
        rules:
          - record: chantico_power_watts:avg1m
            expr: >
              label_replace(
                avg_over_time({__name__=~"chantico_power_watts"}[1m]),
                "resolution", "1m", "", ""
              )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: chantico
  name: chantico-victoriametrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-victoriametrics
  template:
    metadata:
      labels:
        app: chantico-victoriametrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: victoriametrics/victoria-metrics:v1.115.0
        name: victoriametrics
        args:
          - -storageDataPath=/victoria-metrics-data
          - -retentionPeriod={{ .Values.victoriaMetrics.retention }}
          - -httpListenAddr=:8428
        volumeMounts:
        - mountPath: /victoria-metrics-data
          name: data
        ports:
        - containerPort: 8428
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      # vmalert evaluates recording rules against VictoriaMetrics every minute
      # and writes the results back, producing the per-minute downsampled series.
      - image: victoriametrics/vmalert:v1.115.0
        name: vmalert
        args:
          - -rule=/etc/vmalert/rules/*.yml
          - -evaluationInterval=1m
          - -datasource.url=http://localhost:8428
          - -remoteWrite.url=http://localhost:8428
          - -remoteRead.url=http://localhost:8428
          - -httpListenAddr=:8880
        volumeMounts:
        - mountPath: /etc/vmalert/rules
          name: rules
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: data
        {{- include "chantico.volumeSource" (dict "name" "chantico-victoriametrics-data" "persistence" .Values.victoriaMetrics.persistence) | nindent 8 }}
      - name: rules
        configMap:
          name: chantico-victoriametrics-rules
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-victoriametrics
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.victoriaMetrics.service.type }}
  selector:
    app: chantico-victoriametrics
  ports:
    - protocol: TCP
      port: 8428
      {{- if eq .Values.victoriaMetrics.service.type "NodePort" }}
      nodePort: 30003
      {{- else }}
      targetPort: 8428
      {{- end }}
{{- end }}

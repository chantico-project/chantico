{{- if (index .Values "visualisationWebapp").enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chantico-visualisation-webapp-datacenterresources
rules:
- apiGroups:
  - chantico-project.github.io
  resources:
  - datacenterresources
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chantico-visualisation-webapp-datacenterresources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chantico-visualisation-webapp-datacenterresources
subjects:
- kind: ServiceAccount
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chantico-visualisation-webapp
  template:
    metadata:
      labels:
        app: chantico-visualisation-webapp
    spec:
      serviceAccountName: chantico-visualisation-webapp
      containers:
        - name: chantico-visualisation-webapp
          image: "{{ .Values.visualisationWebapp.image.repository }}:{{ .Values.visualisationWebapp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.visualisationWebapp.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          env:
            - name: PORT
              value: "80"
---
apiVersion: v1
kind: Service
metadata:
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.visualisationWebapp.service.type }}
  selector:
    app: chantico-visualisation-webapp
  ports:
    - protocol: TCP
      port: 80
      {{- if eq .Values.visualisationWebapp.service.type "NodePort" }}
      nodePort: 30005
      {{- else }}
      targetPort: 80
      {{- end }}
{{- with .Values.visualisationWebapp.httpRoute }}
{{- if .enabled }}
{{- if not .parentRefs }}
{{- fail "httpRoute is enabled but no parentRefs are specified" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chantico-visualisation-webapp
  namespace: {{ .Release.Namespace }}
  {{- with .annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .parentRefs | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .rules }}
    - backendRefs:
        - name: chantico-visualisation-webapp
          port: 80
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
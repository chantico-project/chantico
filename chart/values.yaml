global:
  # Shared with kube-prometheus-stack, e.g. [{name: my-registry-secret}]
  imagePullSecrets: []

# These are overrides of the default kube prometheus stack values
# Required to disable the default kube prometheus stack components that are not needed for Chantico
# When updating the dependency, be sure to check the default values of the kube prometheus stack and adjust overrides accordingly
kube-prometheus-stack:
  crds:
    upgradeJob:
      enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  grafana:
    enabled: true
    fullnameOverride: chantico-stack-grafana
    adminPassword: admin
    defaultDashboardsEnabled: false
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Viewer
      security:
        allow_embedding: true
      users:
        default_theme: light
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: chantico
        searchNamespace: "" # Search only the release namespace.
        provider:
          name: chantico
          folder: Chantico
          disableDelete: true
          allowUiUpdates: false
      datasources:
        enabled: true
        defaultDatasourceEnabled: false
        label: grafana_datasource
        labelValue: chantico
        searchNamespace: ""
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: false
  prometheus:
    enabled: false
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
    serviceMonitor:
      selfMonitor: false
controller:
  enabled: true
  image:
    registry: "ghcr.io"
    repository: "chantico-project/images/chantico"
    tag: "" # defaults to Chart.version
    digest: "" # overrides tag when set
    pullPolicy: IfNotPresent
  watchNamespace: "" # defaults to the namespace of the release, "*" to watch resources in all namespaces
snmpExporter:
  service:
    type: "ClusterIP"
filebrowser:
  service:
    type: "ClusterIP"
prometheus:
  retention: 5h
  service:
    type: "ClusterIP"
victoriaMetrics:
  enabled: true
  # Long-term retention period (e.g. 12 months)
  retention: 12
  # Settings of the claim template of the StatefulSet
  persistence:
    mountPath: /victoria-metrics-data
    storageClass: "" # empty uses the cluster default storage class
    size: 3Gi
    accessModes:
      - ReadWriteOnce
    volumeName: ""
  service:
    type: "ClusterIP"
webapp:
  enabled: false
  image:
    registry: "ghcr.io"
    repository: "chantico-project/images/chantico-visualisation-webapp"
    tag: "" # defaults to Chart.version
    digest: "" # overrides tag when set
    pullPolicy: IfNotPresent
  service:
    type: "ClusterIP"
  # Gateway API HTTPRoute; needs the Gateway API CRDs and an existing Gateway
  httpRoute:
    enabled: false
    parentRefs: [] # e.g. [{name: my-gateway, namespace: gateway-system}]
    hostnames: [] # empty matches all hostnames of the Gateway listener
    annotations: {}
# Shared claim of the controller, SNMP generator jobs and filebrowser
persistence:
  existingClaim: "" # use this claim instead of creating chantico-persistent-volume-claim
  storageClass: "" # empty uses the cluster default storage class
  size: 3Gi
  accessModes:
    - ReadWriteOnce
  volumeName: ""
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

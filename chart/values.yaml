persistentVolumeClaimName: chantico-persistent-volume-claim
prometheusRetention: 5h
snmpExporterAddress: chantico-snmp:9116
kube-prometheus-stack:
  crds:
    upgradeJob:
      enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: false
  prometheus:
    enabled: false
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
    serviceMonitor:
      selfMonitor: false
imagePullSecretName: "" # Set if pulled from private registry, otherwise leave empty
controller:
  include: true
  image:
    repository: "ghcr.io/chantico-project/images/chantico"
    tag: "" # defaults to Chart.version
snmp:
  service:
    type: "ClusterIP"
filebrowser:
  service:
    type: "ClusterIP"
prometheus:
  useOperator: true
  service:
    type: "ClusterIP"
victoriaMetrics:
  include: true
  # Long-term retention period (e.g. 12 months)
  retention: 12
  # Storage path inside the PVC subPath
  storagePath: /tmp/victoria-metrics-volume/storage
  service:
    type: "ClusterIP"
grafana:
  include: true
  adminPassword: admin
  anonymous: true
  service:
    type: "ClusterIP"
visualisationWebapp:
  include: false
  image:
    repository: "ghcr.io/chantico-project/images/chantico-visualisation-webapp"
    tag: "" # defaults to Chart.version
    pullPolicy: IfNotPresent
  service:
    type: "ClusterIP"
pv:
  include: false
  name: chantico-persistent-volume
  storage: "" # should probably match the pvc
  storageClassName: ""
  hostPath:
    path: "/data/chantico-persistent-volume"
  accessModes:
    - ReadWriteOnce
pvc:
  include: true
  storageClassName: "csi-rbd"
  storage: 3Gi
  accessModes:
    - ReadWriteOnce
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

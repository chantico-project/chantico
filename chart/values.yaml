# Shared volume of controller, generator jobs, snmp exporter, filebrowser and prometheus rules/targets
persistence:
  enabled: true
  existingClaim: "" # defaults to chantico-persistent-volume-claim
  storageClass: "csi-rbd"
  accessModes:
    - ReadWriteOnce # pods sharing a ReadWriteOnce volume are scheduled on the same node
  size: 3Gi
  volumeName: ""
snmpExporterAddress: chantico-snmp:9116
imagePullSecretName: "" # Set if pulled from private registry, otherwise leave empty
controller:
  enabled: true
  image:
    repository: "ghcr.io/chantico-project/images/chantico"
    tag: "" # defaults to Chart.version
  watchNamespace: "" # defaults to the namespace of the release, "*" to watch resources in all namespaces
snmp:
  service:
    type: "ClusterIP"
filebrowser:
  service:
    type: "ClusterIP"
prometheus:
  retention: 5h
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: "csi-rbd"
    accessModes:
      - ReadWriteOnce
    size: 3Gi
  service:
    type: "ClusterIP"
victoriaMetrics:
  enabled: true
  retention: 12 # Long-term retention period (e.g. 12 months)
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 3Gi
  service:
    type: "ClusterIP"
grafana:
  enabled: true
  adminPassword: admin
  anonymous: true
  service:
    type: "ClusterIP"
visualisationWebapp:
  enabled: false
  image:
    repository: "ghcr.io/chantico-project/images/chantico-visualisation-webapp"
    tag: "" # defaults to Chart.version
    pullPolicy: IfNotPresent
  service:
    type: "ClusterIP"
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

name: Docker build and push

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: false
        type: string
      pr:
        required: false
        type: string
      sha:
        required: false
        type: string

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # Docker build and push
  docker:
    name: docker
    if: github.repository == 'chantico-project/chantico' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set tags and image suffixes
        id: meta
        run: |
          if [ ! -z "${{ inputs.version }}" ]; then
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ ! -z "${{ inputs.pr }}" ]; then
            echo "suffix=-pr" >> $GITHUB_OUTPUT
            echo "tag=pr-${{ inputs.pr }}" >> $GITHUB_OUTPUT
            if [ ! -z "${{ inputs.sha }}" ]; then
              SHORT_SHA=$(echo "${{ inputs.sha }}" | cut -c1-7)
              echo "sha_tag=pr-${{ inputs.pr }}-$SHORT_SHA" >> $GITHUB_OUTPUT
            fi
          else
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: chantico-bot
          password: ${{ secrets.BOT_RELEASE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: default
          push: true
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/images
          IMAGE_SUFFIX: ${{ steps.meta.outputs.suffix }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_SHA_TAG: ${{ steps.meta.outputs.sha_tag }}

name: Docker build and push

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: false
        type: string
      pr:
        required: false
        type: string
      sha:
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # Docker build and push
  docker:
    name: docker (${{ matrix.target }})
    if: github.repository == 'chantico-project/chantico' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [controller, visualisation-webapp, snmp-mock, vm-attribution-mock]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set tags and image suffixes
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          elif [ -n "$PR" ]; then
            echo "suffix=-pr" >> $GITHUB_OUTPUT
            echo "tag=pr-$PR" >> $GITHUB_OUTPUT
            if [ -n "$SHA" ]; then
              echo "sha_tag=pr-$PR-${SHA:0:7}" >> $GITHUB_OUTPUT
            fi
          else
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          files: docker-bake.hcl
          targets: ci-${{ matrix.target }}
          push: true
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/images
          IMAGE_SUFFIX: ${{ steps.meta.outputs.suffix }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          IMAGE_ARCH: amd64,arm64

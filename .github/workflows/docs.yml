name: Documentation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  GO_VERSION: "1.26"

jobs:
  # Documentation build
  docs:
    runs-on: ubuntu-latest
    outputs:
      clean_ref: ${{ steps.clean_name.outputs.clean_ref }}
    env:
      DOCS_PORT: 1313
      DOCS_VERBOSE: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Sanitize ref to use in artifact names
        id: clean_name
        run: |
          # Use sed to replace all '/' with '-'
          CLEAN_REF=$(echo "${{ inputs.ref }}" | sed 's/\//-/g')
          echo "clean_ref=${CLEAN_REF}" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            docs/go.sum

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: ~/.cache/hugo_cache/modules
          key: ${{ runner.os }}-hugo-modules-${{ hashFiles('docs/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-modules-

      - name: Download Hugo modules
        run: |
          make docs-mod-download

      - name: Build the documentation
        env:
          HUGO_PARAMS_KROKI_ENDPOINT: http://localhost:8000/
        run: |
          make docs-build

      - name: Run tests
        run: |
          make docs-test

      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ steps.clean_name.outputs.clean_ref }}
          path: docs/public

    services:
      kroki:
        image: yuzutech/kroki:0.34.0
        ports:
          - 8000:8000
        env:
          KROKI_MERMAID_HOST: mermaid
        options: >-
          --health-cmd "wget -qO- http://localhost:8000/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mermaid:
        image: yuzutech/kroki-mermaid:0.34.0 # same version as kroki


  # Deployment of documentation to GitHub Pages
  pages:
    if: inputs.ref == 'refs/heads/main' || startsWith(inputs.ref, 'refs/tags/v')
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-${{ needs.docs.outputs.clean_ref }}
          path: public-html

      - uses: actions/upload-pages-artifact@v5
        with:
          name: pages-${{ needs.docs.outputs.clean_ref }}
          path: public-html

      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ needs.docs.outputs.clean_ref }}

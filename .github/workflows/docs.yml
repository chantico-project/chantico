name: Documentation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  # Documentation build
  docs:
    runs-on: ubuntu-latest
    outputs:
      clean_ref: ${{ steps.clean_name.outputs.clean_ref }}
    env:
      DOCS_PORT: 1313
      DOCS_VERBOSE: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Sanitize ref to use in artifact names
        id: clean_name
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "clean_ref=${REF//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            docs/go.sum

      - name: Cache Hugo modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hugo_cache/modules
          key: ${{ runner.os }}-hugo-modules-${{ hashFiles('docs/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-modules-

      - name: Download Hugo modules
        run: |
          make docs-mod-download

      - name: Build the documentation
        env:
          HUGO_PARAMS_KROKI_ENDPOINT: http://localhost:8000/
        run: |
          make docs-build

      - name: Run tests
        run: |
          make docs-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ steps.clean_name.outputs.clean_ref }}
          path: docs/public

    services:
      kroki:
        image: yuzutech/kroki:0.34.0
        ports:
          - 8000:8000
        env:
          KROKI_MERMAID_HOST: mermaid
        options: >-
          --health-cmd "wget -qO- http://localhost:8000/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mermaid:
        image: yuzutech/kroki-mermaid:0.34.0 # same version as kroki


  # Deployment of documentation to GitHub Pages
  pages:
    if: inputs.ref == 'refs/heads/main' || startsWith(inputs.ref, 'refs/tags/v')
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-${{ needs.docs.outputs.clean_ref }}
          path: public-html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-${{ needs.docs.outputs.clean_ref }}
          path: public-html

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: pages-${{ needs.docs.outputs.clean_ref }}

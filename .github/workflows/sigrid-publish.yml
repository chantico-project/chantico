name: Publish to Sigrid
on:
  push:
    branches:
      - main

jobs:
  sigridci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@cb4fde46381521b4dae698597505c478bd398a4e # v1.8
        with:
          customer: tno
          system: chantico
          publishonly: true
          capability: maintainability,osh,security
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"

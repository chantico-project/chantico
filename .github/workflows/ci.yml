# Main CI workflow using reusable workflows
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  # Linters
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: fmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted according to https://go.dev/blog/gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Read golangci-lint version from tools/go.mod
        id: golangci_lint
        run: echo "version=$(go -C tools list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true
        with:
          version: ${{ steps.golangci_lint.outputs.version }}

  # Tests
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: make test-report

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/gotest

  invoke-docker:
    if: github.repository == 'chantico-project/chantico' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    needs: test
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/docker.yml
    with:
      ref: ${{ github.ref }}
      pr: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}

  invoke-helm:
    if: github.event_name == 'pull_request'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/helm.yml
    with:
      ref: ${{ github.ref }}
      pr: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}

  invoke-docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      ref: ${{ github.ref }}

  # Start a release to create a new Git version
  release:
    if: github.repository == 'chantico-project/chantico' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: go-semantic-release and update versions
        id: release
        run: |
          set -euxo pipefail
          git config --global user.email "semantic-release@github"
          git config --global user.name "go-semantic-release"
          make release-dry-run
          if [ ! -f .version-unreleased ]; then exit 0; fi
          VERSION=$(cat .version-unreleased)
          cat CHANGELOG-unreleased.md CHANGELOG.md > CHANGELOG-temp.md
          mv CHANGELOG-temp.md CHANGELOG.md
          # Commit updated versions in files if changed
          sed -E -i "s/^VERSION([ ?]*)=.*/VERSION\1= $VERSION/" Makefile
          sed -i "s/^version:.*/version: $VERSION/" chart/Chart.yaml
          sed -i "s/appVersion:.*/appVersion: \"v$VERSION\"/" chart/Chart.yaml
          sed -i "s|org.opencontainers.image.version:.*|org.opencontainers.image.version: $VERSION|" chart/Chart.yaml
          sed -Ei "s|org.opencontainers.image.description: \"(.*)--version.*\`\"|org.opencontainers.image.description: \"\1--version $VERSION\`\"|" chart/Chart.yaml
          if ! git diff --quiet; then
            git add CHANGELOG.md Makefile chart/Chart.yaml
            git commit -m "bump version to v$VERSION [skip ci]"
            git push https://$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY HEAD:${GITHUB_REF_NAME}
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push https://$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY "v$VERSION"
          gh release create "v$VERSION" --repo $GITHUB_REPOSITORY --title "v$VERSION" --notes-file CHANGELOG-unreleased.md
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN }}

  invoke-release:
    if: github.repository == 'chantico-project/chantico' && needs.release.outputs.version != ''
    needs: release
    uses: $/.github/workflows/release.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      BOT_RELEASE_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN }}

  invoke-docker-release:
    if: github.repository == 'chantico-project/chantico' && needs.release.outputs.version != ''
    needs: release
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/docker.yml
    with:
      ref: refs/tags/v${{ needs.release.outputs.version }}
      version: ${{ needs.release.outputs.version }}

  invoke-helm-release:
    if: github.repository == 'chantico-project/chantico' && needs.release.outputs.version != ''
    needs: release
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/helm.yml
    with:
      ref: refs/tags/v${{ needs.release.outputs.version }}
      version: ${{ needs.release.outputs.version }}

  invoke-docs-release:
    if: needs.release.outputs.version != ''
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml
    with:
      ref: refs/tags/v${{ needs.release.outputs.version }}

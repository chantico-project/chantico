name: Sigrid pull request feedback
on: [pull_request]

jobs:
  sigridci:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sigrid CI (maintainability, security, open source health)
        uses: Software-Improvement-Group/sigridci@cb4fde46381521b4dae698597505c478bd398a4e # v1.8
        continue-on-error: true
        with:
          customer: tno
          system: chantico
          capability: maintainability,security,osh
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload Sigrid CI output as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigrid-ci-output
          path: sigrid-ci-output/
          if-no-files-found: warn

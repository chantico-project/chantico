name: Sigrid pull request feedback
on: [pull_request]

jobs:
  sigridci:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@main
        with:
          customer: tno
          system: chantico
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload Sigrid CI report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: sigridci-ci-output
          path: sigridci-ci-output/
          if-no-files-found: warn

name: Sigrid pull request feedback
on: [pull_request]

jobs:
  sigridci:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sigrid CI (maintainability)
        uses: Software-Improvement-Group/sigridci@main
        continue-on-error: true
        with:
          customer: tno
          system: chantico
          capability: maintainability
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Sigrid CI (osh)
        uses: Software-Improvement-Group/sigridci@main
        continue-on-error: true
        with:
          customer: tno
          system: chantico
          capability: osh
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Sigrid CI (security)
        uses: Software-Improvement-Group/sigridci@main
        continue-on-error: true
        with:
          customer: tno
          system: chantico
          capability: security
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload Sigrid CI output as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sigrid-ci-output
          path: sigrid-ci-output/
          if-no-files-found: warn
